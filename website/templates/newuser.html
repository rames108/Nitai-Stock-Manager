<!-- newuser.html -->
{% extends "base.html" %} 
{% block title %}Create New User{% endblock %} 
{% block content %}

<form method="POST" action="{{ url_for('auth.create_user') }}">
    <h3 align="center">Create new user</h3>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input
        type="email"
        class="form-control"
        id="email"
        name="email"
        placeholder="Enter email"
        required
      />
    </div>
    <div class="form-group">
      <label for="name">First Name</label>
      <input
        type="text"
        class="form-control"
        id="name"
        name="name"
        placeholder="Enter first name"
        required
      />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="Enter password"
        required
      />
    </div>
    <div class="form-group">
      <label for="is_admin">Admin Access</label>
      <select name="is_admin" id="is_admin" class="form-control" required>
        <option value="" disabled selected>Select admin access</option>  <!-- Placeholder option -->
        <option value="True">True</option>  <!-- admin -->
        <option value="False">False</option>  <!-- not admin -->
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>

{% endblock %}
