{% extends "base.html" %} 
{% block title %}Create New Suppliers{% endblock %} 
{% block content %}

<form method="POST" action="{{ url_for('auth.btnCreateSupplier') }}">
    <h3 align="center">Create new supplier</h3>
    <div class="form-group">
      <label for="name">Supplier Name</label>
      <input
        type="text"
        class="form-control"
        id="name"
        name="name"
        placeholder="Enter supplier name"
        required
      />
    </div>
    <div class="form-group">
      <label for="email">Supplier Email Address</label>
      <input
        type="email"
        class="form-control"
        id="email"
        name="email"
        placeholder="Enter email"
        required
      />
    </div>
    <div class="form-group">
      <label for="location">Supplier Location</label>
      <input
        type="location"
        class="form-control"
        id="location"
        name="location"
        placeholder="Enter Location"
        required
      />
    </div>
    <div class="form-group">
        <label for="description">Description</label>
        <input
          type="description"
          class="form-control"
          id="description"
          name="description"
          placeholder="Enter Description"
          required
        />
      </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>

{% endblock %}
