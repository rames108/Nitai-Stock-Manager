<!-- checkout.html -->
{% extends "base.html" %}  <!-- Extend the base layout for consistent styling -->

{% block content %}  <!-- Begin the content block -->

<link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>

<h1>Checkout</h1>  <!-- Display the checkout page title -->
<form method="POST" action="/submit_checkout">  <!-- Form to submit checkout details -->
    {% if checkout %}  <!-- Check if there are items in the checkout -->
        {% for item in checkout.items %}  <!-- Loop through each item in the checkout -->
            <div>
                <h2>{{ item.item.txtItemName }}</h2>  <!-- Display the item's name -->
                <p>Price: {{ item.item_price }}</p>  <!-- Display the item's price -->
                <input type="number" value="{{ item.quantity }}" min="1" onchange="updateQuantity({{ item.id }}, this.value)">  <!-- Input for item quantity with change event -->
                <button type="button" onclick="removeItem({{ item.id }})" class="btn btn-danger">Remove</button>  <!-- Button to remove the item from checkout -->
            </div>
        {% endfor %}
        <select name="customer_id" id="customer_id" required>
            <option value="" disabled selected>Select a customer</option>
            {% for customer in customers %}
                <option value="{{ customer.id }}">{{ customer.name }}</option>
            {% endfor %}
        </select>
        <select name="payment_method" id="payment_method" required>  <!-- Dropdown to select payment method -->
            <option value="" disabled selected>Select a payment method</option>  <!-- Placeholder option -->
            <option value="cash">Cash</option>  <!-- Cash option -->
            <option value="card">Card</option>  <!-- Card option -->
        </select>
        <input type="number" name="amount_paid" placeholder="Amount Paid" required>  <!-- Input for amount paid -->
        <button type="submit">Complete Checkout</button>  <!-- Button to submit the checkout form -->
    {% else %}
        <p>No items in checkout.</p>  <!-- Message if there are no items in the checkout -->
    {% endif %}
</form>

<script>
function updateQuantity(itemId, quantity) {  // Function to update item quantity
    fetch(`/update_checkout_item/${itemId}`, {  // Send a POST request to update the quantity
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams({
            'quantity': quantity  // Send the new quantity in the request body
        })
    })
    .then(response => response.json())  // Parse the JSON response
    .then(data => {
        if (data.success) {
            alert('Quantity updated!');  // Alert user of successful update
            location.reload(); // Reload to reflect changes
        } else {
            alert(data.message);  // Alert user of any error messages
        }
    });
}

function removeItem(itemId) {  // Function to remove an item from checkout
    fetch(`/remove_checkout_item/${itemId}`, {  // Send a POST request to remove the item
        method: 'POST'
    })
    .then(response => response.json())  // Parse the JSON response
    .then(data => {
        if (data.success) {
            alert('Item removed from checkout!');  // Alert user of successful removal
            location.reload(); // Reload to reflect changes
        } else {
            alert(data.message);  // Alert user of any error messages
        }
    });
}
$(document).ready(function() {
    $('#customer_id').select2({
        placeholder: "Select a customer",
        allowClear: true
    });
});
</script>
{% endblock %}  <!-- End the content block -->
